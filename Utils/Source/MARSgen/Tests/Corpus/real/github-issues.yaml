openapi: 3.0.3
info:
  version: 1.1.4
  title: GitHub v3 REST API
  description: GitHub's v3 REST API.
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://docs.github.com/articles/github-terms-of-service
  contact:
    name: Support
    url: https://support.github.com/contact?tags=dotcom-rest-api
  x-github-plan: api.github.com
servers:
- url: https://api.github.com
paths:
  /repos/{owner}/{repo}/issues:
    get:
      summary: List repository issues
      description: 'List issues in a repository. Only open issues will be listed.


        > [!NOTE]

        > GitHub''s REST API considers every pull request an issue, but not every issue is a pull request.
        For this reason, "Issues" endpoints may return both issues and pull requests in the response.
        You can identify pull requests by the `pull_request` key. Be aware that the `id` of a pull request
        returned from "Issues" endpoints will be an _issue id_. To find out the pull request id, use the
        "[List pull requests](https://docs.github.com/rest/pulls/pulls#list-pull-requests)" endpoint.


        This endpoint supports the following custom media types. For more information, see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response will include
        `body`. This is the default if you do not pass any specific media type.

        - **`application/vnd.github.text+json`**: Returns a text only representation of the markdown body.
        Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s markdown. Response
        will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations. Response
        will include `body`, `body_text`, and `body_html`.'
      tags:
      - issues
      operationId: issues/list-for-repo
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/issues#list-repository-issues
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - name: milestone
        description: If an `integer` is passed, it should refer to a milestone by its `number` field.
          If the string `*` is passed, issues with any milestone are accepted. If the string `none` is
          passed, issues without milestones are returned.
        in: query
        required: false
        schema:
          type: string
      - name: state
        description: Indicates the state of the issues to return.
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - closed
          - all
          default: open
      - name: assignee
        description: Can be the name of a user. Pass in `none` for issues with no assigned user, and `*`
          for issues assigned to any user.
        in: query
        required: false
        schema:
          type: string
      - name: type
        description: Can be the name of an issue type. If the string `*` is passed, issues with any type
          are accepted. If the string `none` is passed, issues without type are returned.
        in: query
        required: false
        schema:
          type: string
      - name: creator
        description: The user that created the issue.
        in: query
        required: false
        schema:
          type: string
      - name: mentioned
        description: A user that's mentioned in the issue.
        in: query
        required: false
        schema:
          type: string
      - name: issue_field_values
        description: 'A comma-separated list of issue field filters in `field_slug:value` format.

          Only issues matching all specified field values are returned.

          Requires issue fields to be enabled for the repository. Issue fields are

          not available for user-owned repositories, and field availability for

          organization-owned public repositories depends on the organization''s

          visibility settings. For example, `priority:Urgent,severity:High` filters

          issues where the `priority` field is `Urgent` AND the `severity` field is

          `High`.'
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/labels'
      - name: sort
        description: What to sort results by.
        in: query
        required: false
        schema:
          type: string
          enum:
          - created
          - updated
          - comments
          default: created
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/since'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/issue'
              examples:
                default:
                  $ref: '#/components/examples/issue-items'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '422':
          $ref: '#/components/responses/validation_failed'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: issues
    post:
      summary: Create an issue
      description: 'Any user with pull access to a repository can create an issue. If [issues are disabled
        in the repository](https://docs.github.com/articles/disabling-issues/), the API returns a `410
        Gone` status.


        This endpoint triggers [notifications](https://docs.github.com/github/managing-subscriptions-and-notifications-on-github/about-notifications).
        Creating content too quickly using this endpoint may result in secondary rate limiting. For more
        information, see "[Rate limits for the API](https://docs.github.com/rest/using-the-rest-api/rate-limits-for-the-rest-api#about-secondary-rate-limits)"

        and "[Best practices for using the REST API](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api)."


        This endpoint supports the following custom media types. For more information, see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response will include
        `body`. This is the default if you do not pass any specific media type.

        - **`application/vnd.github.text+json`**: Returns a text only representation of the markdown body.
        Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s markdown. Response
        will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations. Response
        will include `body`, `body_text`, and `body_html`.'
      tags:
      - issues
      operationId: issues/create
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/issues#create-an-issue
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  oneOf:
                  - type: string
                  - type: integer
                  description: The title of the issue.
                body:
                  type: string
                  description: The contents of the issue.
                assignee:
                  type: string
                  description: 'Login for the user that this issue should be assigned to. _NOTE: Only
                    users with push access can set the assignee for new issues. The assignee is silently
                    dropped otherwise. **This field is closing down.**_'
                  nullable: true
                milestone:
                  oneOf:
                  - type: string
                  - type: integer
                    description: 'The `number` of the milestone to associate this issue with. _NOTE: Only
                      users with push access can set the milestone for new issues. The milestone is silently
                      dropped otherwise._'
                  nullable: true
                labels:
                  type: array
                  description: 'Labels to associate with this issue. _NOTE: Only users with push access
                    can set labels for new issues. Labels are silently dropped otherwise._'
                  items:
                    oneOf:
                    - type: string
                    - type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        color:
                          type: string
                          nullable: true
                assignees:
                  type: array
                  description: 'Logins for Users to assign to this issue. _NOTE: Only users with push
                    access can set assignees for new issues. Assignees are silently dropped otherwise._'
                  items:
                    type: string
                issue_field_values:
                  type: array
                  description: An array of issue field values to set on this issue. Each field value must
                    include the field ID and the value to set. Issue fields are only available for organization-owned
                    repositories with the feature enabled. Field values are silently dropped otherwise.
                  items:
                    type: object
                    properties:
                      field_id:
                        type: integer
                        description: The ID of the issue field to set
                      value:
                        oneOf:
                        - type: string
                        - type: number
                        - type: array
                          items:
                            type: string
                        description: The value to set for the field. For multi-select fields, provide
                          an array of option names.
                    required:
                    - field_id
                    - value
                    additionalProperties: false
                type:
                  type: string
                  description: 'The name of the issue type to associate with this issue. _NOTE: Only users
                    with push access can set the type for new issues. The type is silently dropped otherwise._'
                  nullable: true
                  example: Epic
                parent_issue_id:
                  type: integer
                  description: 'The id of the parent issue to add this issue to as a sub-issue. _NOTE:
                    Only users with triage access to both the parent issue''s repository and this repository
                    can set the parent issue._'
              required:
              - title
            examples:
              default:
                value:
                  title: Found a bug
                  body: I'm having a problem with this.
                  assignees:
                  - octocat
                  milestone: 1
                  labels:
                  - bug
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue'
              examples:
                default:
                  $ref: '#/components/examples/issue'
          headers:
            Location:
              example: https://api.github.com/repos/octocat/Hello-World/issues/1347
              schema:
                type: string
        '400':
          $ref: '#/components/responses/bad_request'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_failed'
        '503':
          $ref: '#/components/responses/service_unavailable'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
      x-github:
        triggersNotification: true
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: issues
      x-github-breaking-changes:
      - changeset: remove_singular_assignee_from_issues_and_pull_requests
        patch:
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    assignee: null
        version: '2026-03-10'
  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      summary: Get an issue
      description: 'The API returns a [`301 Moved Permanently` status](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api#follow-redirects)
        if the issue was

        [transferred](https://docs.github.com/articles/transferring-an-issue-to-another-repository/) to
        another repository. If

        the issue was transferred to or deleted from a repository where the authenticated user lacks read
        access, the API

        returns a `404 Not Found` status. If the issue was deleted from a repository where the authenticated
        user has read

        access, the API returns a `410 Gone` status. To receive webhook events for transferred and deleted
        issues, subscribe

        to the [`issues`](https://docs.github.com/webhooks/event-payloads/#issues) webhook.


        > [!NOTE]

        > GitHub''s REST API considers every pull request an issue, but not every issue is a pull request.
        For this reason, "Issues" endpoints may return both issues and pull requests in the response.
        You can identify pull requests by the `pull_request` key. Be aware that the `id` of a pull request
        returned from "Issues" endpoints will be an _issue id_. To find out the pull request id, use the
        "[List pull requests](https://docs.github.com/rest/pulls/pulls#list-pull-requests)" endpoint.


        This endpoint supports the following custom media types. For more information, see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response will include
        `body`. This is the default if you do not pass any specific media type.

        - **`application/vnd.github.text+json`**: Returns a text only representation of the markdown body.
        Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s markdown. Response
        will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations. Response
        will include `body`, `body_text`, and `body_html`.'
      tags:
      - issues
      operationId: issues/get
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/issues#get-an-issue
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue'
              examples:
                default:
                  summary: Issue
                  value:
                    $ref: '#/components/examples/issue'
                pinned_comment:
                  summary: Issue with pinned comment
                  value:
                    $ref: '#/components/examples/issue-with-pinned-comment'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
        '304':
          $ref: '#/components/responses/not_modified'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: issues
    patch:
      summary: Update an issue
      description: 'Issue owners and users with push access or Triage role can edit an issue.


        This endpoint supports the following custom media types. For more information, see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response will include
        `body`. This is the default if you do not pass any specific media type.

        - **`application/vnd.github.text+json`**: Returns a text only representation of the markdown body.
        Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s markdown. Response
        will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations. Response
        will include `body`, `body_text`, and `body_html`.'
      tags:
      - issues
      operationId: issues/update
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/issues#update-an-issue
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  oneOf:
                  - type: string
                  - type: integer
                  description: The title of the issue.
                  nullable: true
                body:
                  type: string
                  description: The contents of the issue.
                  nullable: true
                assignee:
                  type: string
                  nullable: true
                  description: Username to assign to this issue. **This field is closing down.**
                state:
                  type: string
                  description: The open or closed state of the issue.
                  enum:
                  - open
                  - closed
                state_reason:
                  type: string
                  enum:
                  - completed
                  - not_planned
                  - duplicate
                  - reopened
                  nullable: true
                  description: The reason for the state change. Ignored unless `state` is changed.
                  example: not_planned
                duplicate_issue_id:
                  type: integer
                  description: The ID of the issue to mark as the canonical duplicate when `state_reason`
                    is `duplicate`. The issue must exist and be accessible to the authenticated user.
                    Ignored when `state_reason` is not `duplicate`.
                milestone:
                  oneOf:
                  - type: string
                  - type: integer
                    description: The `number` of the milestone to associate this issue with or use `null`
                      to remove the current milestone. Only users with push access can set the milestone
                      for issues. Without push access to the repository, milestone changes are silently
                      dropped.
                  nullable: true
                labels:
                  type: array
                  description: Labels to associate with this issue. Pass one or more labels to _replace_
                    the set of labels on this issue. Send an empty array (`[]`) to clear all labels from
                    the issue. Only users with push access can set labels for issues. Without push access
                    to the repository, label changes are silently dropped.
                  items:
                    oneOf:
                    - type: string
                    - type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        color:
                          type: string
                          nullable: true
                        rationale:
                          type: string
                          description: Optional reasoning for selecting this label.
                        suggest:
                          type: boolean
                          description: If `true`, the change is stored as a pending suggestion for human
                            review rather than applied directly.
                        confidence:
                          type: string
                          description: The confidence level for this label choice.
                          enum:
                          - low
                          - medium
                          - high
                assignees:
                  type: array
                  description: Usernames to assign to this issue. Pass one or more user logins to _replace_
                    the set of assignees on this issue. Send an empty array (`[]`) to clear all assignees
                    from the issue. Only users with push access can set assignees for new issues. Without
                    push access to the repository, assignee changes are silently dropped.
                  items:
                    oneOf:
                    - type: string
                    - type: object
                      properties:
                        login:
                          type: string
                        rationale:
                          type: string
                          description: Optional reasoning for selecting this assignee.
                        suggest:
                          type: boolean
                          description: If `true`, the change is stored as a pending suggestion for human
                            review rather than applied directly.
                        confidence:
                          type: string
                          description: The confidence level for this assignee choice.
                          enum:
                          - low
                          - medium
                          - high
                issue_field_values:
                  type: array
                  description: An array of issue field values to set on this issue. Each field value must
                    include the field ID and the value to set. Only users with push access can set field
                    values for issues
                  items:
                    type: object
                    properties:
                      field_id:
                        type: integer
                        description: The ID of the issue field to set
                      value:
                        oneOf:
                        - type: string
                        - type: number
                        - type: array
                          items:
                            type: string
                        description: The value to set for the field. For multi-select fields, provide
                          an array of option names.
                      rationale:
                        type: string
                        description: Optional reasoning for setting this field value.
                      suggest:
                        type: boolean
                        description: If `true`, the change is stored as a pending suggestion for human
                          review rather than applied directly.
                      confidence:
                        type: string
                        description: The confidence level for this field value choice.
                        enum:
                        - low
                        - medium
                        - high
                    required:
                    - field_id
                    - value
                    additionalProperties: false
                type:
                  description: The issue type to associate with this issue. Only users with push access
                    can set the type for issues. Without push access to the repository, type changes are
                    silently dropped.
                  nullable: true
                  oneOf:
                  - type: string
                    description: The name of the issue type.
                    example: Epic
                  - type: object
                    description: The issue type with optional metadata.
                    properties:
                      value:
                        type: string
                        description: The name of the issue type to associate with this issue, or `null`
                          to remove the current issue type.
                        nullable: true
                        example: Epic
                      rationale:
                        type: string
                        description: Optional reasoning for selecting this type.
                      suggest:
                        type: boolean
                        description: If `true`, the change is stored as a pending suggestion for human
                          review rather than applied directly.
                      confidence:
                        type: string
                        description: The confidence level for this type choice.
                        enum:
                        - low
                        - medium
                        - high
            examples:
              default:
                value:
                  title: Found a bug
                  body: I'm having a problem with this.
                  assignees:
                  - octocat
                  milestone: 1
                  state: open
                  labels:
                  - bug
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/issue'
                - type: object
                  properties:
                    suggestions:
                      type: object
                      description: 'Pending suggestions for each suggestible field (`type`,

                        `issue_field_values`, `labels`, `assignees`, `state`) the

                        request touched. Omitted for fields not in the request or

                        with no pending or ignored suggestions. Items tagged

                        `ignored` are echoes of the current request''s inputs that

                        were not persisted as pending suggestions.

                        '
                      properties:
                        type:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        issue_field_values:
                          type: array
                          items:
                            type: object
                            properties:
                              field_id:
                                type: integer
                              value:
                                oneOf:
                                - type: string
                                - type: number
                                - type: array
                                  items:
                                    type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        labels:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        assignees:
                          type: array
                          items:
                            type: object
                            properties:
                              login:
                                type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        state:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              state_reason:
                                type: string
                              duplicate_issue_id:
                                type: integer
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
              examples:
                default:
                  $ref: '#/components/examples/issue'
        '422':
          $ref: '#/components/responses/validation_failed'
        '503':
          $ref: '#/components/responses/service_unavailable'
        '403':
          $ref: '#/components/responses/forbidden'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: issues
      x-github-breaking-changes:
      - changeset: remove_singular_assignee_from_issues_and_pull_requests
        patch:
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    assignee: null
        version: '2026-03-10'
  /users/{username}:
    get:
      summary: Get a user
      description: 'Provides publicly available information about someone with a GitHub account.


        If the specified user has a [private profile](https://docs.github.com/account-and-profile/concepts/personal-profile#private-profiles),
        the `followers` and `following` values are `0` unless the request is authenticated as that user.
        A request authenticated as the specified user returns the actual values even if the token has
        no OAuth scopes.


        The `events_url` value is a URI template. Replace `{/privacy}` with `/public` to retrieve only
        public events. Omit it to retrieve public events and, when authenticated as the user, private
        events. For more information, see "[List events for the authenticated user](https://docs.github.com/rest/activity/events#list-events-for-the-authenticated-user)."


        If you are requesting information about an [Enterprise Managed User](https://docs.github.com/enterprise-cloud@latest/admin/managing-iam/understanding-iam-for-enterprises/about-enterprise-managed-users),
        or a GitHub App bot that is installed in an organization that uses Enterprise Managed Users, your
        requests must be authenticated as a user or GitHub App that has access to the organization to
        view that account''s information. If you are not authorized, the request will return a `404 Not
        Found` status.


        The `email` key in the following response is the publicly visible email address from your GitHub
        [profile page](https://github.com/settings/profile). When setting up your profile, you can select
        a primary email address to be public which provides an email entry for this endpoint. If you do
        not set a public email address for `email`, then it will have a value of `null`. You only see
        publicly visible email addresses when authenticated with GitHub. For more information, see [Authentication](https://docs.github.com/rest/guides/getting-started-with-the-rest-api#authentication).


        The Emails API enables you to list all of your email addresses, and toggle a primary email to
        be visible publicly. For more information, see [Emails API](https://docs.github.com/rest/users/emails).'
      tags:
      - users
      operationId: users/get-by-username
      externalDocs:
        description: API method documentation
