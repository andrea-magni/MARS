;Connection definitions of IBDAC (InterBase, Firebird), read by TMARSIBDAC.LoadConnectionDefs in
;Server.Ignition: IBDAC.<definition name>.<item of the IBDAC connect string>=<value>, or the whole
;string in IBDAC.<definition name>.ConnectString. {bin} is the folder of the server: on a local
;server, the demo creates the database file and its CUSTOMERS table when they are missing.
;See https://andrea-magni.github.io/MARS/features/ibdac
IBDAC.MAIN_DB.Server=localhost
IBDAC.MAIN_DB.Port=3050
IBDAC.MAIN_DB.Database={bin}\IBDACDEMO.FDB
IBDAC.MAIN_DB.User ID=SYSDBA
IBDAC.MAIN_DB.Password=<password>
IBDAC.MAIN_DB.Client Library=fbclient.dll
IBDAC.MAIN_DB.Charset=UTF8
;IBDAC.REPORTS.ConnectString=Server=localhost;Database=C:\Data\REPORTS.FDB;User ID=reader;Password=secret

;the definition used by [Context] TMARSIBDAC and TIBCConnection without an [IBDACConnection]
;attribute (a parameter of the application: DefaultApp.)
;DefaultApp.IBDAC.ConnectionDefName=MAIN_DB
