;Settings of this server flavor. The ones shared by all the flavors are in Server.ini, included
;below: a value set here overrides the one of Server.ini (i.e. a different Port to run two flavors
;at the same time).
[Include]
Base=Server.ini

[DefaultEngine]
;Port=8081
;Name and display name of the Windows service
;ServiceName=MyServerService
;ServiceDisplayName=My Server Service
