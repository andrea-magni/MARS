;Settings shared by all the server flavors of this project: each flavor has its own ini file
;(named after the executable) that includes this one with [Include] and can override any value.
;See https://andrea-magni.github.io/MARS/reference/parameters#shared-configuration-include
[DefaultEngine]
;BasePath=/rest
;Port=8080
;PortSSL=0
;Port=0 disables plain HTTP
ThreadPoolSize=100

;DefaultApp.JWT.Issuer=MARS-Curiosity
;MARSCmd fills JWT.Secret with a random value when it creates a project from this template.
;Without a secret, a DEBUG build uses a random per-process one; a RELEASE build refuses to handle tokens.
;DefaultApp.JWT.Secret=
;Key rotation: JWT.KeyId names JWT.Secret (sent as "kid" in the tokens); a retired secret stays
;valid for verification as JWT.PreviousSecret.<its KeyId>, or JWT.PreviousSecret if it had no KeyId.
;DefaultApp.JWT.KeyId=
;DefaultApp.JWT.PreviousSecret.<kid>=
;DefaultApp.JWT.PreviousSecret=
;DefaultApp.JWT.CookieEnabled=true
;DefaultApp.JWT.CookieName=access_token
;CookieDomain default: hostname of the request
;DefaultApp.JWT.CookieDomain=
;CookiePath default: base path of the request
;DefaultApp.JWT.CookiePath=
;DefaultApp.JWT.Duration=1
;DefaultApp.JWT.Duration.InSeconds=3600
;DefaultApp.JWT.Duration.InMinutes=60
;DefaultApp.JWT.CookieSecure=false

;JSON responses: false writes non-ASCII characters as they are instead of \uXXXX escapes
;DefaultApp.JSON.EscapeNonASCII=true

;Compression.Enabled=True

;CORS.Enabled=True
;CORS.Origin=*
;CORS.Methods=HEAD,GET,PUT,POST,DELETE,OPTIONS
;CORS.Headers=X-Requested-With,Content-Type,Authorization

;HTTPS served directly by DCS (PortSSL above), no reverse proxy needed. Certificate and private
;key in PEM format (the certificate file can hold the whole chain, e.g. fullchain.pem); OpenSSL:
;libssl-3-x64.dll and libcrypto-3-x64.dll (Win64) or libssl-3.dll and libcrypto-3.dll (Win32)
;next to the executable, libssl on Linux. Relative paths: folder of the executable.
;DCS.SSL.CertFile=localhost.crt
;DCS.SSL.KeyFile=localhost.key

OpenAPI.info.title=My title
;OpenAPI.info.summary=My summary
OpenAPI.info.description=My description
OpenAPI.info.termsOfService=https://dummy.org/termsOfService/

OpenAPI.info.contact.name=Martian Developer
OpenAPI.info.contact.url=https://mars.space
OpenAPI.info.contact.email=me@mars.space

;OpenAPI.info.license.name=Apache 2.0
;OpenAPI.info.license.identifier=
;OpenAPI.info.license.url=https://www.apache.org/licenses/LICENSE-2.0.html

OpenAPI.info.version=0.1.0


