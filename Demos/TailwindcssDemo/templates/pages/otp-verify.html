@LayoutPage layouts/public.html

<div id="login-box" class="w-full max-w-sm rounded-xl bg-white p-8 text-center shadow">
  <p class="mb-4 text-slate-600">
    Enter the 6-digit code from your authenticator app
  </p>

  <form hx-post="@page.BasePath/app/otp"
        hx-target="#login-box"
        hx-swap="outerHTML"
        class="space-y-3">
    <input type="text" name="otp" maxlength="6" inputmode="numeric" autofocus required
           class="w-full rounded-lg border px-3 py-2 text-center text-xl tracking-widest focus:ring-2 focus:ring-emerald-500">
    <button type="submit"
            class="w-full rounded-lg bg-emerald-600 py-2 font-medium text-white hover:bg-emerald-700">
      Verify
    </button>
  </form>

  <button type="button"
    hx-get="@page.BasePath/app/otp/qrcode"
    hx-target="#qr-container"
    hx-swap="innerHTML"
    class="mt-3 w-full rounded-lg border border-emerald-600 py-2 font-medium text-emerald-600 hover:bg-emerald-50">
    Show QR Code
  </button>

  <div id="qr-container" class="mt-4"></div>

  @if page.HasError {
    <p class="mt-3 text-sm text-red-600">@page.Error</p>
  }
</div>
