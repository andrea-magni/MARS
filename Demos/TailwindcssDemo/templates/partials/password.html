<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="password-dialog">
  <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-lg">
    <h2 class="mb-4 text-lg font-semibold">
      Change password for @user.UserName
    </h2>

    <form hx-post="@page.BasePath/app/users/@user.Id/password"
          hx-target="#modal"
          hx-swap="innerHTML"
          class="space-y-3">
      <input type="password" name="newPassword" placeholder="New password" required
             class="w-full rounded-lg border px-3 py-2">
      <input type="password" name="confirmPassword" placeholder="Confirm password" required
             class="w-full rounded-lg border px-3 py-2">

      <div class="flex justify-end gap-2 pt-2">
        <button type="button"
                class="rounded-lg px-4 py-2 text-slate-600 hover:bg-slate-100"
                onclick="document.getElementById('modal').innerHTML=''">
          Cancel
        </button>
        <button type="submit"
                class="rounded-lg bg-amber-600 px-4 py-2 text-white hover:bg-amber-700">
          Update
        </button>
      </div>
    </form>

    @if page.HasError {
      <p class="mt-3 text-sm text-red-600">@page.Error</p>
    }
    @if page.HasSuccess {
      <p class="mt-3 text-sm text-emerald-600">@page.Success</p>
      <script>
        document.body.dispatchEvent(new Event('user-changed'));
        setTimeout(function () {
          document.getElementById('modal').innerHTML = '';
        }, 800);
      </script>
    }
  </div>
</div>
