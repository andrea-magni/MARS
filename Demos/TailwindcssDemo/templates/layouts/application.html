<!-- templates/layouts/application.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@page.Title - MARS TailwindcssDemo</title>
  <link rel="stylesheet" href="@page.BasePath/static/css/output.css">

  <script src="@page.BasePath/static/js/htmx.min.js"></script>
  <!--
    Optional: @tailwindplus/elements powers the interactive dropdowns / mobile menu in the
    sidebar and topbar partials. It is distributed under a PROPRIETARY Tailwind Plus licence
    (https://tailwindcss.com/plus/license) and is therefore NOT bundled with this demo.
    If you hold a Tailwind Plus licence, uncomment the line below to enable those components;
    without it the pages render and Tailwind styling works, only some menus stay static.
  -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script> -->
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
  <div class="min-h-screen lg:flex">
    @Import  partials/sidebar.html

    <div class="min-w-0 flex-1">
      @Import  partials/topbar.html

      <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        @Import  partials/flash-message.html
        @RenderBody
      </main>
    </div>
  </div>

  <div id="modal"></div>
  
</body>
</html>
